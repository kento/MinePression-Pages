<text x="630.0" y="695" text-anchor="middle" class="label">Compression ratio (original / compressed)</text>
<text transform="translate(28,542.5) rotate(-90)" text-anchor="middle" class="label">Occurrences</text>
<text x="64" y="756" class="tick">Higher ratios are better; values below 1 mean expansion. Payload retains internal block headers, CRC, tables and controls.</text>
<text x="64" y="780" class="tick">The exact period-divides-2 family is separate from the proxy sample; neither is the full 2^80-input distribution.</text>
</svg>
