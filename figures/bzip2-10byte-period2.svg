<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
<title>10-byte bzip2: Exact family: byte period divides 2</title>
<desc>Two histograms of compressed size divided by original size; lower is smaller. Whole stream and outer-framing-excluded payload. Counts do not represent all 2^80 inputs.</desc>
<rect width="1200" height="800" fill="#f6f8fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17233c}.tick{font-size:14px;fill:#536078}.label{font-size:17px}.heading{font-size:23px;font-weight:bold}</style>
<text x="64" y="48" font-size="30" font-weight="bold">10-byte bzip2 compression distribution</text>
<text x="64" y="78" class="label">Exact family: byte period divides 2 | n = 65,536</text>
<text x="64" y="120" class="heading">Whole bzip2 stream</text>
<line x1="130" y1="340.00" x2="1130" y2="340.00" stroke="#d8dfea"/>
<text x="120" y="345.00" text-anchor="end" class="tick">0</text>
<line x1="130" y1="288.75" x2="1130" y2="288.75" stroke="#d8dfea"/>
<text x="120" y="293.75" text-anchor="end" class="tick">16,589</text>
<line x1="130" y1="237.50" x2="1130" y2="237.50" stroke="#d8dfea"/>
<text x="120" y="242.50" text-anchor="end" class="tick">33,178</text>
<line x1="130" y1="186.25" x2="1130" y2="186.25" stroke="#d8dfea"/>
<text x="120" y="191.25" text-anchor="end" class="tick">49,766</text>
<line x1="130" y1="135.00" x2="1130" y2="135.00" stroke="#d8dfea"/>
<text x="120" y="140.00" text-anchor="end" class="tick">66,355</text>
<rect x="240.000" y="339.951" width="180.000" height="0.049" fill="#2669b8"><title>370%: 16 occurrences</title></rect>
<rect x="440.000" y="328.137" width="180.000" height="11.863" fill="#2669b8"><title>380%: 3,840 occurrences</title></rect>
<rect x="640.000" y="339.259" width="180.000" height="0.741" fill="#2669b8"><title>390%: 240 occurrences</title></rect>
<rect x="840.000" y="150.185" width="180.000" height="189.815" fill="#2669b8"><title>400%: 61,440 occurrences</title></rect>
<text x="130.00" y="363" text-anchor="middle" class="tick">360</text>
<text x="330.00" y="363" text-anchor="middle" class="tick">370</text>
<text x="530.00" y="363" text-anchor="middle" class="tick">380</text>
<text x="730.00" y="363" text-anchor="middle" class="tick">390</text>
<text x="930.00" y="363" text-anchor="middle" class="tick">400</text>
<text x="1130.00" y="363" text-anchor="middle" class="tick">410</text>
<line x1="130" y1="340" x2="1130" y2="340" stroke="#536078"/>
<text x="630.0" y="390" text-anchor="middle" class="label">Compression ratio (%) = compressed bits / 80 x 100</text>
<text transform="translate(28,237.5) rotate(-90)" text-anchor="middle" class="label">Occurrences</text>
<text x="64" y="425" class="heading">Payload (outer framing excluded)</text>
<line x1="130" y1="645.00" x2="1130" y2="645.00" stroke="#d8dfea"/>
<text x="120" y="650.00" text-anchor="end" class="tick">0</text>
<line x1="130" y1="593.75" x2="1130" y2="593.75" stroke="#d8dfea"/>
<text x="120" y="598.75" text-anchor="end" class="tick">16,589</text>
<line x1="130" y1="542.50" x2="1130" y2="542.50" stroke="#d8dfea"/>
