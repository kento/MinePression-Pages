<rect x="430.262" y="339.259" width="174.346" height="0.741" fill="#2669b8"><title>0.25641026×: 240 occurrences</title></rect>
<rect x="634.175" y="328.137" width="174.346" height="11.863" fill="#2669b8"><title>0.26315789×: 3,840 occurrences</title></rect>
<rect x="849.110" y="339.951" width="174.346" height="0.049" fill="#2669b8"><title>0.27027027×: 16 occurrences</title></rect>
<text x="130.00" y="363" text-anchor="middle" class="tick">0.24359</text>
<text x="255.00" y="363" text-anchor="middle" class="tick">0.247726</text>
<text x="380.00" y="363" text-anchor="middle" class="tick">0.251862</text>
