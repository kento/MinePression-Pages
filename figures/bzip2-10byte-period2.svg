<text x="1130.00" y="363" text-anchor="middle" class="tick">0.276681</text>
<line x1="130" y1="340" x2="1130" y2="340" stroke="#536078"/>
<text x="630.0" y="390" text-anchor="middle" class="label">Compression ratio (original / compressed)</text>
<text transform="translate(28,237.5) rotate(-90)" text-anchor="middle" class="label">Occurrences</text>
