<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
<title>10-byte bzip2: Exact family: byte period divides 2</title>
<desc>Two histograms of original size divided by compressed size; higher is better. Whole stream and outer-framing-excluded payload. Counts do not represent all 2^80 inputs.</desc>
<rect width="1200" height="800" fill="#f6f8fc"/>
<style>text{font-family:Arial,sans-serif;fill:#17233c}.tick{font-size:14px;fill:#536078}.label{font-size:17px}.heading{font-size:23px;font-weight:bold}</style>
<text x="64" y="48" font-size="30" font-weight="bold">10-byte bzip2 compression distribution</text>
<text x="64" y="78" class="label">Exact family: byte period divides 2 | n = 65,536</text>
<text x="64" y="120" class="heading">Whole bzip2 stream</text>
<line x1="130" y1="340.00" x2="1130" y2="340.00" stroke="#d8dfea"/>
<text x="120" y="345.00" text-anchor="end" class="tick">0</text>
<line x1="130" y1="288.75" x2="1130" y2="288.75" stroke="#d8dfea"/>
<text x="120" y="293.75" text-anchor="end" class="tick">16,589</text>
<line x1="130" y1="237.50" x2="1130" y2="237.50" stroke="#d8dfea"/>
<text x="120" y="242.50" text-anchor="end" class="tick">33,178</text>
<line x1="130" y1="186.25" x2="1130" y2="186.25" stroke="#d8dfea"/>
<text x="120" y="191.25" text-anchor="end" class="tick">49,766</text>
<line x1="130" y1="135.00" x2="1130" y2="135.00" stroke="#d8dfea"/>
<text x="120" y="140.00" text-anchor="end" class="tick">66,355</text>
