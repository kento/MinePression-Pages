<line x1="130" y1="440.00" x2="1130" y2="440.00" stroke="#d8dfea"/>
<text x="120" y="445.00" text-anchor="end" class="tick">66,355</text>
<rect x="152.000" y="644.997" width="36.000" height="0.003" fill="#008471"><title>226.25%: 1 occurrences</title></rect>
<rect x="272.000" y="644.954" width="36.000" height="0.046" fill="#008471"><title>230%: 15 occurrences</title></rect>
