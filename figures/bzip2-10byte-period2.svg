<text x="610.00" y="668" text-anchor="middle" class="tick">240</text>
<text x="730.00" y="668" text-anchor="middle" class="tick">243.75</text>
<text x="850.00" y="668" text-anchor="middle" class="tick">247.5</text>
<text x="970.00" y="668" text-anchor="middle" class="tick">251.25</text>
<text x="1090.00" y="668" text-anchor="middle" class="tick">255</text>
<line x1="130" y1="645" x2="1130" y2="645" stroke="#536078"/>
<text x="630.0" y="695" text-anchor="middle" class="label">Compression ratio (%) = compressed bits / 80 x 100</text>
<text transform="translate(28,542.5) rotate(-90)" text-anchor="middle" class="label">Occurrences</text>
<text x="64" y="756" class="tick">Payload retains internal block headers, CRC, tables and coding controls. Ratios above 100% mean expansion.</text>
<text x="64" y="780" class="tick">The exact period-divides-2 family is separate from the proxy sample; neither is the full 2^80-input distribution.</text>
</svg>
