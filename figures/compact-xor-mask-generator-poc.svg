<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><title>Compact XOR-mask generator proof of concept</title><desc>Left: complete-frame compression ratio against input size for known SHAKE16 masks with zero and sparse residuals. Right: complete stored bytes for the ordinary baseline and the winning result after blind exhaustive search. Lower stored bytes and higher compression ratios are better.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#19363b}.title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#536b70}.panel-title{font-size:21px;font-weight:700}.axis-label{font-size:15px;font-weight:600}.tick{font-size:13px;fill:#5d7175}.annotation{font-size:13px;fill:#405a5f}.value{font-size:13px;font-weight:700}.frame{fill:#fff;stroke:#cbd6d4;stroke-width:1.5}.grid{stroke:#e2e9e7;stroke-width:1}.break-even{stroke:#9b5b42;stroke-width:2;stroke-dasharray:8 6}.base-line{fill:none;stroke:#89999a;stroke-width:3}.zero-line{fill:none;stroke:#b95632;stroke-width:4}.sparse-line{fill:none;stroke:#167a78;stroke-width:4}.marker-base{fill:#89999a}.marker-zero{fill:#b95632}.marker-sparse{fill:#167a78}.baseline-bar{fill:#96a5a5}.winner-bar{fill:#167a78}</style><rect width="100%" height="100%" fill="#f7f5ef"/><text x="80" y="58" class="title">A 3-byte mask description can beat storing X—when X matches its codebook</text><text x="80" y="91" class="subtitle">Complete size = mode/family tag + parameters + bzip2 stream; ratio = original bytes / stored bytes</text><rect x="114.0" y="190.0" width="650.0" height="560.0" class="frame"/><rect x="900.0" y="190.0" width="620.0" height="560.0" class="frame"/><text x="114.0" y="145" class="panel-title">A · Known SHAKE16 description, size sweep</text><text x="900.0" y="145" class="panel-title">B · Blind search over 196,864 descriptions</text><line x1="114.0" y1="750.00" x2="764.0" y2="750.00" class="grid"/><text x="100.0" y="755.00" text-anchor="end" class="tick">0.25×</text><line x1="114.0" y1="699.09" x2="764.0" y2="699.09" class="grid"/><text x="100.0" y="704.09" text-anchor="end" class="tick">0.5×</text><line x1="114.0" y1="648.18" x2="764.0" y2="648.18" class="break-even"/><text x="100.0" y="653.18" text-anchor="end" class="tick">1×</text><line x1="114.0" y1="597.27" x2="764.0" y2="597.27" class="grid"/><text x="100.0" y="602.27" text-anchor="end" class="tick">2×</text><line x1="114.0" y1="546.36" x2="764.0" y2="546.36" class="grid"/><text x="100.0" y="551.36" text-anchor="end" class="tick">4×</text><line x1="114.0" y1="495.45" x2="764.0" y2="495.45" class="grid"/><text x="100.0" y="500.45" text-anchor="end" class="tick">8×</text><line x1="114.0" y1="444.55" x2="764.0" y2="444.55" class="grid"/><text x="100.0" y="449.55" text-anchor="end" class="tick">16×</text><line x1="114.0" y1="393.64" x2="764.0" y2="393.64" class="grid"/><text x="100.0" y="398.64" text-anchor="end" class="tick">32×</text><line x1="114.0" y1="342.73" x2="764.0" y2="342.73" class="grid"/><text x="100.0" y="347.73" text-anchor="end" class="tick">64×</text><line x1="114.0" y1="291.82" x2="764.0" y2="291.82" class="grid"/><text x="100.0" y="296.82" text-anchor="end" class="tick">128×</text><line x1="114.0" y1="240.91" x2="764.0" y2="240.91" class="grid"/><text x="100.0" y="245.91" text-anchor="end" class="tick">256×</text><line x1="114.0" y1="190.00" x2="764.0" y2="190.00" class="grid"/><text x="100.0" y="195.00" text-anchor="end" class="tick">512×</text><line x1="114.00" y1="190.0" x2="114.00" y2="750.0" class="grid"/><text x="114.00" y="779.0" text-anchor="middle" class="tick">16 B</text><line x1="244.00" y1="190.0" x2="244.00" y2="750.0" class="grid"/><text x="244.00" y="779.0" text-anchor="middle" class="tick">64 B</text><line x1="374.00" y1="190.0" x2="374.00" y2="750.0" class="grid"/><text x="374.00" y="779.0" text-anchor="middle" class="tick">256 B</text><line x1="504.00" y1="190.0" x2="504.00" y2="750.0" class="grid"/><text x="504.00" y="7