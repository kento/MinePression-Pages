="259.98" width="48.0" height="490.02" class="baseline-bar"/><text x="1260.50" y="250.98" text-anchor="middle" class="value">4,097</text><rect x="1290.50" y="259.98" width="48.0" height="490.02" class="winner-bar"/><text x="1314.50" y="250.98" text-anchor="middle" class="value">4,097</text><text x="1287.50" y="778.0" text-anchor="middle" class="tick">independent</text><text x="1287.50" y="797.0" text-anchor="middle" class="tick">pseudo-random</text><text x="1287.50" y="823.0" text-anchor="middle" class="annotation">winner: raw</text><rect x="1391.50" y="587.47" width="48.0" height="162.53" class="baseline-bar"/><text x="1415.50" y="578.47" text-anchor="middle" class="value">160</text><rect x="1445.50" y="591.98" width="48.0" height="158.02" class="winner-bar"/><text x="1469.50" y="582.98" text-anchor="middle" class="value">153</text><text x="1442.50" y="778.0" text-anchor="middle" class="tick">repeated</text><text x="1442.50" y="797.0" text-anchor="middle" class="tick">JSON-like text</text><text x="1442.50" y="823.0" text-anchor="middle" class="annotation">winner: period2</text><text transform="translate(815 470.0) rotate(-90)" text-anchor="middle" class="axis-label">Complete stored bytes (lower is better, log₂)</text><rect x="922.0" y="208.0" width="18" height="18" class="baseline-bar"/><text x="949.0" y="223.0" class="annotation">best of raw/direct bzip2</text><rect x="1170.0" y="208.0" width="18" height="18" class="winner-bar"/><text x="1197.0" y="223.0" class="annotation">winner after generator search</text><text x="80" y="872" class="subtitle">Positive controls intentionally belong to the SHAKE16 codebook. The independent pseudo-random control correctly falls back to raw.</text><text x="80" y="902" class="subtitle">This proves a possible size gain for matching data, not that arbitrary or typical data will match; search time is excluded from stored size.</text></svg>
