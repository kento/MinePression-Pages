<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>Held-out Silesia staged multi-codec benchmark</title><desc>Net complete-size savings by codec, the share attributable to MRI and X-ray frames, and bounded exhaustive audit recall.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17363b}.title{font-size:34px;font-weight:750}.subtitle{font-size:17px;fill:#526c71}.panel{font-size:22px;font-weight:700}.axis{font-size:14px;fill:#5e7478}.grid{stroke:#dde7e4;stroke-width:1}.bar{rx:5}.value{font-size:16px;font-weight:700}.note{font-size:15px;fill:#405b60}.card{fill:#fff;stroke:#cad6d3;stroke-width:1.5}.metric{font-size:30px;font-weight:750}.metric-label{font-size:14px;fill:#587075}.line{fill:none;stroke-width:4}.point{stroke:#fff;stroke-width:2}</style><rect width="100%" height="100%" fill="#f7f5ef"/><text x="74" y="58" class="title">Held-out data tests whether short-program mining generalizes</text><text x="74" y="91" class="subtitle">72 deterministic Silesia frames · complete stored size includes every descriptor and codec stream · larger compression ratio is better</text><text x="74" y="145" class="panel">A · Aggregate net saving versus raw/direct fallback</text><line x1="150.0" y1="470.0" x2="1530.0" y2="470.0" class="grid"/><text x="136.0" y="475.0" text-anchor="end" class="axis">0.000%</text><line x1="150.0" y1="414.0" x2="1530.0" y2="414.0" class="grid"/><text x="136.0" y="419.0" text-anchor="end" class="axis">1.120%</text><line x1="150.0" y1="358.0" x2="1530.0" y2="358.0" class="grid"/><text x="136.0" y="363.0" text-anchor="end" class="axis">2.239%</text><line x1="150.0" y1="302.0" x2="1530.0" y2="302.0" class="grid"/><text x="136.0" y="307.0" text-anchor="end" class="axis">3.359%</text><line x1="150.0" y1="246.0" x2="1530.0" y2="246.0" class="grid"/><text x="136.0" y="251.0" text-anchor="end" class="axis">4.479%</text><line x1="150.0" y1="190.0" x2="1530.0" y2="190.0" class="grid"/><text x="136.0" y="195.0" text-anchor="end" class="axis">5.598%</text><rect x="250.5" y="447.3" width="144" height="22.7" fill="#177b78" class="bar"/><text x="322.5" y="437.3" text-anchor="middle" class="value">0.4536%</text><text x="322.5" y="498.0" text-anchor="middle" class="axis">bzip2 · 21,992 B</text><rect x="595.5" y="232.7" width="144" height="237.3" fill="#c45f38" class="bar"/><text x="667.5" y="222.7" text-anchor="middle" class="value">4.7445%</text><text x="667.5" y="498.0" text-anchor="middle" class="axis">gzip · 262,216 B</text><rect x="940.5" y="368.7" width="144" height="101.3" fill="#5779a8" class="bar"/><text x="1012.5" y="358.7" text-anchor="middle" class="value">2.0260%</text><text x="1012.5" y="498.0" text-anchor="middle" class="axis">xz · 89,382 B</text><rect x="1285.5" y="238.7" width="144" height="231.3" fill="#7f5aa2" class="bar"/><text x="1357.5" y="228.7" text-anchor="middle" class="value">4.6243%</text><text x="1357.5" y="498.0" text-anchor="middle" class="axis">zstd · 255,124 B</text><text x="74" y="555" class="panel">B · Where the saved bytes came from</text><line x1="150.0" y1="860.0" x2="1530.0" y2="860.0" class="grid"/><text x="136.0" y="865.0" text-anchor="end" class="axis">0%</text><line x1="150.0" y1="795.0" x2="1530.0" y2="795.0" class="grid"/><text x="136.0" y="800.0" text-anchor="end" class="axis">25%</text><line x1="150.0" y1="730.0" x2="1530.0" y2="730.0" class="grid"/><text x="136.0" y="735.0" text-anchor="end" class="axis">50%</text><line x1="150.0" y1="665.0" x2="1530.0" y2="665.0" class="grid"/><text x="136.0" y="670.0" text-anchor="end" class="axis">75%</text><line x1="150.0" y1="600.0" x2="1530.0" y2="600.0" class="grid"/><text x="136.0" y="605.0" text-anchor="end" class="axis">100%</text><rect x="250.5" y="600.0" width="144" height="260.0" fill="#dfe7e5" class="bar"/><rect x="250.5" y="607.2" width="144" height="252.8" fill="#177b78" class="bar"/><text x="322.5" y="597.2" text-anchor="middle" class="value">97.23%</text><text x="322.5" y="887.0" text-anchor="middle" class="axis">bzip2 · other categories 609 B</text><rect x="595.5" y="600.0" width="144" height="260.0" fill="#dfe7e5" class="bar"/><rect x="595.5" y="600.3" width="144" height="259.7" fill="#c45f38" class="bar"/><text x="667.5" y="590.3" text-anchor="middle" class="value">99.89%</text><text x="667.5" y="887.0" text-anchor="middle" class="axis">gzip · other categories 295 B</text><rect x="940.5" y="600.0" width="144" height="260.0" fill="#dfe7e5" class="bar"/><rect x="940.5" y="603.8" width="144" height="256.2" fill="#5779a8" class="bar"/><text x="1012.5" y="593.8" text-anchor="middle" class="value">98.54%</text><text x="1012.5" y="887.0" text-anchor="middle" class="axis">xz · other categories 1,306 B</text><rect x="1285.5" y="600.0" width="144" height="260.0" fill="#dfe7e5" class="bar"/><rect x="1285.5" y="602.5" width="144" height="257.5" fill="#7f5aa2" class="bar"/><text x="1357.5" y="592.5" text-anchor="middle" class="value">99.03%</text><text x="1357.5" y="887.0" text-anchor="middle" class="axis">zstd · other categories 2,479 B</text><text x="1530" y="555" text-anchor="end" class="axis">colored: MRI + X-ray · gray: all other categories</text><rect x="74.0" y="955.0" width="340.0" height="105.0" rx="10" class="card"/><text x="92.0" y="982.0" class="metric-label">Bounded audit</text><text x="92.0" y="1019.0" class="metric">27 / 48</text><text x="92.0" y="1043.0" class="metric-label">exact staged stored-size cells</text><rect x="454.0" y="955.0" width="340.0" height="105.0" rx="10" class="card"/><text x="472.0" y="982.0" class="metric-label">Savings recall</text><text x="472.0" y="1019.0" class="metric">94.391%</text><text x="472.0" y="1043.0" class="metric-label">214 B missed</text><rect x="834.0" y="955.0" width="340.0" height="105.0" rx="10" class="card"/><text x="852.0" y="982.0" class="metric-label">Real-data frames</text><text x="852.0" y="1019.0" class="metric">72</text><text x="852.0" y="1043.0" class="metric-label">12 files · four frame sizes</text><rect x="1214.0" y="955.0" width="340.0" height="105.0" rx="10" class="card"/><text x="1232.0" y="982.0" class="metric-label">Negative controls</text><text x="1232.0" y="1019.0" class="metric">0 B expansion</text><text x="1232.0" y="1043.0" class="metric-label">all four sizes chose raw</text><text x="74" y="1100" class="note">Timing is machine-specific; stored-byte accounting and round-trip checks are exact. The audit covers the fixed 285-program language, not arbitrary programs.</text></svg>
